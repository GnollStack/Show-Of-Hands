name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run check:syntax
      - run: npm run check:release
      - run: npm run smoke
      - if: matrix.node-version == 22
        run: npm run package:release -- --output "${{ runner.temp }}/show-of-hands.zip"
